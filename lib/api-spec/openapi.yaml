openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: VisaFlow France API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User management
  - name: students
    description: Student profiles and dossiers
  - name: schools
    description: Schools and programs
  - name: countries
    description: Countries
  - name: workflows
    description: Workflow templates
  - name: student-steps
    description: Student workflow steps
  - name: checklists
    description: Checklists
  - name: documents
    description: Document management
  - name: comments
    description: Comments and notes
  - name: tasks
    description: Tasks
  - name: appointments
    description: Appointments
  - name: notifications
    description: Notifications
  - name: audit-logs
    description: Audit logs
  - name: risk-scores
    description: Risk scoring
  - name: dashboard
    description: Dashboard summaries
  - name: storage
    description: File storage
  - name: finance
    description: Financial proofs, accommodation, CVEC and submission readiness
  - name: matrix
    description: Per-nationality × program-level document matrix
  - name: intake-calendar
    description: Campus France & visa intake deadlines per nationality
  - name: projet-etudes
    description: Projet d'études and motivation letters with AI coach
  - name: copilot
    description: Advisor AI copilot, risk narrative explainer and chat translation
  - name: interviews
    description: Campus France interview simulator
  - name: billing
    description: Subscription plans and Stripe billing
  - name: branding
    description: Tenant white-label branding and settings
  - name: twofa
    description: TOTP two-factor authentication
  - name: gdpr
    description: GDPR data export and erasure
  - name: playbooks
    description: Advisor playbooks (SOP) catalog and admin CRUD

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /ai/health:
    get:
      operationId: getAiHealth
      tags: [health]
      summary: AI subsystem health (admin only)
      responses:
        "200":
          description: AI health report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiHealthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ─── USERS ───────────────────────────────────────────────────────────────────
  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin)
      parameters:
        - name: role
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProfile"

  /users/{userId}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user (admin)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  # ─── COUNTRIES ───────────────────────────────────────────────────────────────
  /countries:
    get:
      operationId: listCountries
      tags: [countries]
      summary: List all countries
      responses:
        "200":
          description: List of countries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Country"
    post:
      operationId: createCountry
      tags: [countries]
      summary: Create country (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCountryBody"
      responses:
        "201":
          description: Created country
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Country"

  /countries/{countryId}:
    patch:
      operationId: updateCountry
      tags: [countries]
      summary: Update country
      parameters:
        - name: countryId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCountryBody"
      responses:
        "200":
          description: Updated country
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Country"

  # ─── SCHOOLS ─────────────────────────────────────────────────────────────────
  /schools:
    get:
      operationId: listSchools
      tags: [schools]
      summary: List all schools
      responses:
        "200":
          description: List of schools
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/School"
    post:
      operationId: createSchool
      tags: [schools]
      summary: Create school (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSchoolBody"
      responses:
        "201":
          description: Created school
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/School"

  /schools/{schoolId}:
    get:
      operationId: getSchool
      tags: [schools]
      summary: Get school with programs
      parameters:
        - name: schoolId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: School with programs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolWithPrograms"

  /schools/{schoolId}/programs:
    post:
      operationId: createProgram
      tags: [schools]
      summary: Create program for school
      parameters:
        - name: schoolId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProgramBody"
      responses:
        "201":
          description: Created program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"

  /programs:
    get:
      operationId: listPrograms
      tags: [schools]
      summary: List all programs
      responses:
        "200":
          description: List of programs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Program"

  # ─── STUDENTS ────────────────────────────────────────────────────────────────
  /students:
    get:
      operationId: listStudents
      tags: [students]
      summary: List students (advisor sees assigned, admin sees all)
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: advisorId
          in: query
          schema:
            type: ["integer", "null"]
        - name: countryId
          in: query
          schema:
            type: ["integer", "null"]
        - name: schoolId
          in: query
          schema:
            type: ["integer", "null"]
        - name: search
          in: query
          schema:
            type: string
        - name: riskLevel
          in: query
          schema:
            type: string
        - name: readinessLevel
          in: query
          schema:
            $ref: "#/components/schemas/ReadinessLevel"
      responses:
        "200":
          description: List of students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentSummary"
    post:
      operationId: createStudent
      tags: [students]
      summary: Create student with profile and generate workflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStudentBody"
      responses:
        "201":
          description: Created student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"

  /students/{studentId}:
    get:
      operationId: getStudent
      tags: [students]
      summary: Get full student dossier
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Student dossier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentDossier"
    patch:
      operationId: updateStudent
      tags: [students]
      summary: Update student profile
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStudentBody"
      responses:
        "200":
          description: Updated student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"

  /students/{studentId}/assign:
    patch:
      operationId: assignStudent
      tags: [students]
      summary: Assign advisor/reviewer to student
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignStudentBody"
      responses:
        "200":
          description: Assignment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"

  # ─── WORKFLOW STEPS ──────────────────────────────────────────────────────────
  /students/{studentId}/steps:
    get:
      operationId: listStudentSteps
      tags: [student-steps]
      summary: List workflow steps for a student
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Student steps
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentStep"

  /students/{studentId}/steps/{stepId}:
    patch:
      operationId: updateStudentStep
      tags: [student-steps]
      summary: Update a student's workflow step status
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
        - name: stepId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStudentStepBody"
      responses:
        "200":
          description: Updated step
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentStep"

  # ─── CHECKLISTS ──────────────────────────────────────────────────────────────
  /students/{studentId}/steps/{stepId}/checklist:
    get:
      operationId: getStepChecklist
      tags: [checklists]
      summary: Get checklist items for a step
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
        - name: stepId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Checklist items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChecklistItem"

  /students/{studentId}/checklist-items/{itemId}:
    patch:
      operationId: updateChecklistItem
      tags: [checklists]
      summary: Toggle or update checklist item
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChecklistItemBody"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistItem"

  # ─── DOCUMENTS ───────────────────────────────────────────────────────────────
  /students/{studentId}/document-precheck:
    get:
      operationId: getStudentDocumentPrecheck
      tags: [documents]
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Document precheck warnings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentPrecheckResponse"

  /students/{studentId}/documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List documents for student
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
        - name: category
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
    post:
      operationId: createDocument
      tags: [documents]
      summary: Create document record after upload
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDocumentBody"
      responses:
        "201":
          description: Created document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /students/{studentId}/documents/{documentId}:
    get:
      operationId: getDocument
      tags: [documents]
      summary: Get document details
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
        - name: documentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
    patch:
      operationId: updateDocument
      tags: [documents]
      summary: Update document status
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
        - name: documentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDocumentBody"
      responses:
        "200":
          description: Updated document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /students/{studentId}/documents/{documentId}/re-extract:
    post:
      operationId: reExtractDocument
      tags: [documents]
      summary: Re-run AI extraction on a document
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
        - name: documentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated document with refreshed extraction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /students/{studentId}/documents/{documentId}/review:
    post:
      operationId: reviewDocument
      tags: [documents]
      summary: Submit document review (validate or reject)
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
        - name: documentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDocumentBody"
      responses:
        "201":
          description: Review submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentReview"

  # ─── STORAGE ─────────────────────────────────────────────────────────────────
  /storage/upload-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUploadUrlBody"
      responses:
        "200":
          description: Presigned URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"

  /storage/objects/{objectPath}:
    get:
      operationId: getObjectUrl
      tags: [storage]
      summary: Get a signed download URL for an object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Signed download URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadUrlResponse"

  # ─── COMMENTS ────────────────────────────────────────────────────────────────
  /students/{studentId}/comments:
    get:
      operationId: listComments
      tags: [comments]
      summary: List comments for student
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
        - name: internal
          in: query
          schema:
            type: ["boolean", "null"]
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
    post:
      operationId: createComment
      tags: [comments]
      summary: Create comment on student dossier
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentBody"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /students/{studentId}/comments/{commentId}:
    delete:
      operationId: deleteComment
      tags: [comments]
      summary: Delete a comment
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── TASKS ───────────────────────────────────────────────────────────────────
  /students/{studentId}/tasks:
    get:
      operationId: listStudentTasks
      tags: [tasks]
      summary: List tasks for student
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create task for student
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskBody"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{taskId}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskBody"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/my:
    get:
      operationId: listMyTasks
      tags: [tasks]
      summary: List tasks assigned to the current advisor
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: string
      responses:
        "200":
          description: My tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"

  # ─── APPOINTMENTS ────────────────────────────────────────────────────────────
  /students/{studentId}/appointments:
    get:
      operationId: listAppointments
      tags: [appointments]
      summary: List appointments for student
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Appointment"
    post:
      operationId: createAppointment
      tags: [appointments]
      summary: Create appointment for student
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAppointmentBody"
      responses:
        "201":
          description: Created appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"

  /appointments/{appointmentId}:
    patch:
      operationId: updateAppointment
      tags: [appointments]
      summary: Update appointment
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAppointmentBody"
      responses:
        "200":
          description: Updated appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
    delete:
      operationId: deleteAppointment
      tags: [appointments]
      summary: Delete appointment
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── POST-ARRIVAL STEPS ─────────────────────────────────────────────────────
  /students/{studentId}/post-arrival-steps:
    get:
      operationId: listPostArrivalSteps
      tags: [students]
      summary: List post-arrival steps for a student
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Post-arrival steps
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PostArrivalStep"
  /students/{studentId}/post-arrival-steps/regenerate:
    post:
      operationId: regeneratePostArrivalSteps
      tags: [students]
      summary: Idempotently (re)provision the post-arrival workflow
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Number of steps added
          content:
            application/json:
              schema:
                type: object
                properties:
                  studentId: { type: integer }
                  added: { type: integer }
                required: [studentId, added]
  /students/{studentId}/post-arrival-steps/{stepId}:
    patch:
      operationId: updatePostArrivalStep
      tags: [students]
      summary: Update a post-arrival step
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
        - name: stepId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePostArrivalStepBody"
      responses:
        "200":
          description: Updated post-arrival step
          content:
