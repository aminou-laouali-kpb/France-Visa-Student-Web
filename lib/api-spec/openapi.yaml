          description: User not found

components:
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AiHealthResponse:
      type: object
      properties:
        configured:
          type: boolean
        reachable:
          type: boolean
        model:
          type: string
        monthlyBudgetUsd:
          type: number
        monthSpentUsd:
          type: number
        error:
          type: ["string", "null"]
      required:
        - configured
        - reachable
